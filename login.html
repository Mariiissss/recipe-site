<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Что приготовить?</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <h1 class="logo"><a href="index.html">🍳 Что приготовить?</a></h1>
            <div id="authBlock"></div>
        </div>
    </header>

    <main>
        <div class="auth-page">
            <div class="auth-card">
                <h1>С возвращением!</h1>
                <p class="auth-card__subtitle">Войдите, чтобы сохранять рецепты</p>

                <div class="form-error" id="errorBox"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" required placeholder="••••••">
                    </div>
                    <button type="submit" class="btn btn--primary btn--block">Войти</button>
                </form>

                <p class="form-footer">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Что приготовить? — учебный проект</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
